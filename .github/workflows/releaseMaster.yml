name: "[master] Release"

permissions:
  contents: write

on:
 push:
  branches:
   - master
  paths-ignore:
   - "**/*.md"
   - ".vscode/**"
 workflow_dispatch:

jobs:
 Build:
  uses: ./.github/workflows/build.yml

 Release:
  name: Release latest on GitHub
  needs: Build
  runs-on: ubuntu-latest

  steps:
   - name: Download All Artifacts
     uses: actions/download-artifact@v4
     with:
      name: luna-artifacts
      path: ./dist/

   - name: Publish latest release on GitHub
     env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
     run: |
      gh release delete latest --yes --cleanup-tag || true
      gh release create latest ./dist/** --title "Latest Release" --latest
